---
- hosts: alpine-docker
  become: true
  tasks:
    - name: Ensure Docker and related packages are installed
      community.general.apk:
        name:
          - docker
          - docker-cli-compose
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure Docker service is started
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Run Docker Compose up
      command: docker-compose up -d
      args:
        chdir: /app
      # when: ansible_facts.packages.docker is defined

